# Local development infrastructure: Postgres (pgvector) + Redis.
# Usage: docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: neviso-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: neviso
      POSTGRES_PASSWORD: neviso
      POSTGRES_DB: neviso
    ports:
      - '5432:5432'
    volumes:
      - neviso_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U neviso -d neviso']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: neviso-dev-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - neviso_dev_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  neviso_dev_pgdata:
  neviso_dev_redisdata:
