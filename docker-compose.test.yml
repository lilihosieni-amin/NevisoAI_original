# Ephemeral test infrastructure for integration/e2e runs (CI + local).
# Ports are offset (+1) so they never clash with the dev stack.
# Data lives in tmpfs — wiped on container stop.
# Usage: docker compose -f docker-compose.test.yml up -d
services:
  postgres-test:
    image: pgvector/pgvector:pg16
    container_name: neviso-test-postgres
    environment:
      POSTGRES_USER: neviso
      POSTGRES_PASSWORD: neviso
      POSTGRES_DB: neviso_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U neviso -d neviso_test']
      interval: 3s
      timeout: 5s
      retries: 20

  redis-test:
    image: redis:7-alpine
    container_name: neviso-test-redis
    ports:
      - '6380:6379'
    tmpfs:
      - /data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 5s
      retries: 20
